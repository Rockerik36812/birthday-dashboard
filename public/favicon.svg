<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC407A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C2185B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8FB2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F06292;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8F9FA;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo rosa redondeado -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Caja del regalo (debajo de la tapa) -->
  <rect x="128" y="300" width="256" height="150" rx="22" fill="url(#box)" stroke="#E91E63" stroke-width="5"/>

  <!-- Tapa -->
  <rect x="128" y="222" width="256" height="92" rx="16" fill="url(#lid)"/>
  <rect x="128" y="222" width="256" height="40" rx="16" fill="#FFFFFF"/>

  <!-- Cinta vertical -->
  <rect x="249" y="128" width="14" height="320" rx="7" fill="#C2185B"/>

  <!-- Cinta horizontal (sobre la caja) -->
  <rect x="120" y="330" width="272" height="14" rx="7" fill="#C2185B"/>

  <!-- Moño: dos óvalos -->
  <g transform="translate(256 104)">
    <ellipse cx="-40" cy="8" rx="50" ry="28" transform="rotate(-22 -40 8)" fill="#C2185B"/>
    <ellipse cx="40" cy="8" rx="50" ry="28" transform="rotate(22 40 8)" fill="#C2185B"/>
    <ellipse cx="0" cy="-6" rx="24" ry="30" fill="#C2185B"/>
    <circle cx="0" cy="6" r="12" fill="#E91E63"/>
  </g>
  <!-- Nudo central -->
  <circle cx="256" cy="124" r="22" fill="#E91E63"/>
  <circle cx="256" cy="124" r="9" fill="#FFFFFF"/>

</svg>