version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://cumple.erikservicios.click}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-dev-secret-change-in-production-min-32-chars}
      - EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST:-smtp.gmail.com}
      - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT:-587}
      - EMAIL_SERVER_USER=${EMAIL_SERVER_USER}
      - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM:-Birthday Dashboard <noreply@erikservicios.click>}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Birthday Dashboard}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://cumple.erikservicios.click}
    volumes:
      - birthday-data:/app/data
    restart: unless-stopped

volumes:
  birthday-data:
    driver: local